name: Build umx for R

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # schedule:
    # Daily check against CRAN OpenMx
    # - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      run_cran:
        description: 'CRAN OpenMx: stock OpenMx, required before any umx CRAN submission'
        type: boolean
        required: true
        default: true
      run_genomicmx_cached:
        description: 'Cached GenomicMx: reuse last successful Fresh Unix library (no compile)'
        type: boolean
        required: true
        default: false
      run_genomicmx_fresh:
        description: 'Fresh GenomicMx: compile current GenomicMx master, then save as the cached library (requires PAT)'
        type: boolean
        required: true
        default: false
      run_full_matrix:
        description: 'Run full OS/R version matrix check against CRAN'
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  # 1. Standard: Check against stock CRAN OpenMx (Fast)
  check_cran:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_cran == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up R (release)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # Quick CI: no GenomicSEM (github install is slow/flaky; vignette is eval=FALSE).
      # Vignettes are skipped here — modification_indices/profile-CI knit is multi-hour;
      # full vignette build stays on weekly matrix / workflow_dispatch.
      # ggwas is Suggests + Remotes (GitHub-only until on CRAN); pin github:: so pak does not look on CRAN.
      - name: Install Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::rcmdcheck
            any::OpenMx
            any::mvtnorm
            any::DiagrammeRsvg
            any::rsvg
            any::lme4
            github::bczech/ggwas
          needs: check

      - name: Check Package Structure
        uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--no-vignettes")'
          error-on: '"error"'

  # 2. Cached GenomicMx: last successful Fresh library. No compile.
  check_genomicmx_cached:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_genomicmx_cached == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up R (release)
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::rcmdcheck
            any::OpenMx
            any::mvtnorm
            any::DiagrammeRsvg
            any::rsvg
            any::lme4
            github::bczech/ggwas
          needs: check

      - name: Restore last GenomicMx library
        id: cache-genomicmx
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.R_LIBS_USER }}/OpenMx
          key: genomicmx-lib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-
          restore-keys: |
            genomicmx-lib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-

      - name: Require a cached GenomicMx library
        if: steps.cache-genomicmx.outputs.cache-matched-key == ''
        run: |
          echo "No cached GenomicMx library for this OS/R version."
          echo "Run this workflow with 'Fresh GenomicMx' once. After that job succeeds, Cached will reuse it."
          exit 1

      - name: Show GenomicMx version
        run: |
          Rscript -e 'cat("OpenMx", as.character(packageVersion("OpenMx")), "\n"); sha <- file.path(find.package("OpenMx"), "GENOMICMX_SHA"); if (file.exists(sha)) cat("GenomicMx SHA", readLines(sha, warn = FALSE), "\n")'

      - name: Check Package Structure
        uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--no-vignettes")'
          error-on: '"error"'

  # 3. Fresh GenomicMx: compile current master, save library for Cached (slow)
  check_genomicmx_fresh:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_genomicmx_fresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up R (release)
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::rcmdcheck
            any::OpenMx
            any::mvtnorm
            any::DiagrammeRsvg
            any::rsvg
            any::RcppEigen
            any::StanHeaders
            any::BH
            any::rpf
            any::RcppParallel
            any::Matrix
            any::digest
            any::MASS
            any::lifecycle
            any::lme4
            github::bczech/ggwas
          needs: check

      - name: Compile and install GenomicMx
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "secrets.PAT is empty; cannot clone private tbates/GenomicMx" >&2
            exit 1
          fi
          git -c http.https://github.com/.extraheader= clone --depth 1 "https://x-access-token:${PAT}@github.com/tbates/GenomicMx"
          SHA=$(git -C GenomicMx rev-parse HEAD)
          echo "Cloned GenomicMx $SHA"
          cd GenomicMx
          Rscript -e 'lib <- Sys.getenv("R_LIBS_USER"); if (!nzchar(lib)) lib <- .libPaths()[[1]]; dir.create(lib, recursive = TRUE, showWarnings = FALSE); install.packages(c("Matrix","MASS","Rcpp","RcppEigen","RcppParallel","StanHeaders","BH","rpf","digest","lifecycle"), lib = lib, repos = "https://cloud.r-project.org")'
          make cran-install
          echo "$SHA" > "${R_LIBS_USER}/OpenMx/GENOMICMX_SHA"

      - name: Save GenomicMx library for Cached
        uses: actions/cache/save@v5
        with:
          path: ${{ env.R_LIBS_USER }}/OpenMx
          key: genomicmx-lib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ github.run_id }}

      - name: Show GenomicMx version
        run: |
          Rscript -e 'cat("OpenMx", as.character(packageVersion("OpenMx")), "\n"); sha <- file.path(find.package("OpenMx"), "GENOMICMX_SHA"); if (file.exists(sha)) cat("GenomicMx SHA", readLines(sha, warn = FALSE), "\n")'

      - name: Check Package Structure
        uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--no-vignettes")'
          error-on: '"error"'

  # 4. Manual/On-Demand: Full OS Matrix testing against CRAN (expensive)
  full_matrix:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_matrix == 'true'
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up R ${{ matrix.config.r }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::rcmdcheck
            any::OpenMx
            any::mvtnorm
            any::DiagrammeRsvg
            any::rsvg
            any::lme4
            github::bczech/ggwas
          needs: check

      - name: Check Package Structure
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
