name: Build umx for R

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Daily check against CRAN OpenMx
    - cron: '0 0 * * *'
    # Run full matrix every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. Push/PR: Tests against GenomicMx private build
  quick_genomicmx:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up R (release)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # Quick CI: no GenomicSEM (github install is slow/flaky; vignette is eval=FALSE).
      # Vignettes are skipped here — modification_indices/profile-CI knit is multi-hour;
      # full vignette build stays on weekly matrix / workflow_dispatch.
      # ggwas is Suggests + Remotes (GitHub-only until on CRAN); pin github:: so pak does not look on CRAN.
      - name: Install Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::rcmdcheck
            any::covr
            any::OpenMx
            any::mvtnorm
            any::DiagrammeRsvg
            any::rsvg
            any::RcppEigen
            any::StanHeaders
            any::BH
            any::rpf
            github::bczech/ggwas
          needs: check

      - name: Get GenomicMx latest SHA
        id: genomicmx-sha
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          echo "sha=$(git ls-remote https://${PAT}@github.com/tbates/GenomicMx master | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Cache GenomicMx Build
        id: cache-genomicmx
        uses: actions/cache@v4
        with:
          path: OpenMx_*.tar.gz
          key: genomicmx-${{ runner.os }}-${{ steps.genomicmx-sha.outputs.sha }}

      - name: Build and Upload GenomicMx
        if: steps.cache-genomicmx.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.PAT }}
        run: |
          git clone --depth 1 https://${PAT}@github.com/tbates/GenomicMx
          R CMD build GenomicMx
          gh release upload latest OpenMx_*.tar.gz --clobber --repo tbates/umx || echo "Upload to latest release failed"

      - name: Install GenomicMx
        run: |
          R CMD INSTALL OpenMx_*.tar.gz

      - name: Check Package Structure
        uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--no-vignettes")'
          error-on: '"error"'

      - name: Code Coverage
        run: covr::codecov()
        shell: Rscript {0}


  # 2. Daily: Tests against stock CRAN OpenMx
  daily_cran:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up R (release)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # Quick CI: no GenomicSEM (github install is slow/flaky; vignette is eval=FALSE).
      # Vignettes are skipped here — modification_indices/profile-CI knit is multi-hour;
      # full vignette build stays on weekly matrix / workflow_dispatch.
      # ggwas is Suggests + Remotes (GitHub-only until on CRAN); pin github:: so pak does not look on CRAN.
      - name: Install Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::rcmdcheck
            any::covr
            any::OpenMx
            any::mvtnorm
            any::DiagrammeRsvg
            any::rsvg
            github::bczech/ggwas
          needs: check

      - name: Check Package Structure
        uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--no-vignettes")'
          error-on: '"error"'


  # 3. Weekly/Manual: Full OS Matrix testing against CRAN
  full_matrix:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1')
    runs-on: ${{ matrix.config.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up R ${{ matrix.config.r }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::rcmdcheck
            any::OpenMx
            any::mvtnorm
            any::DiagrammeRsvg
            any::rsvg
            github::bczech/ggwas
          needs: check

      - name: Check Package Structure
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
